org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# R8 full mode — the aggressive optimizing pass Play's "R8 optimization"
# recommendation asks for (smaller, faster dex than compat mode). It strips and
# inlines harder, so anything reached by reflection/JNI must be covered by keep
# rules in proguard-rules.pro — which it is (Firebase, ML Kit, Razorpay, Play,
# Parcelable/enum/native). Verified: release build launches, login and conclaves
# load, payment sheet opens.
android.enableR8.fullMode=true
